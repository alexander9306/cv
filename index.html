<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexander Damaso — CV</title>
<style>
  :root {
    --bg: #f5f4f1;
    --panel: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #514f4a;
    --ink-faint: #857f76;
    --accent: #b1502a;
    --accent-soft: #f0e3da;
    --line: #e4e0d8;
    --radius: 10px;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  /* ---------- Header ---------- */
  header.cv-header {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 44px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  header.cv-header::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--accent);
  }
  .name {
    font-family: var(--serif);
    font-size: 2.4rem;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .role {
    font-size: 1.05rem;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 18px;
  }
  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    font-size: 0.92rem;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .contact-row a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  .contact-row a:hover { color: var(--accent); border-color: var(--accent); }
  .summary {
    font-size: 0.98rem;
    color: var(--ink-soft);
    max-width: 66ch;
  }

  .toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 20px;
  }
  .btn {
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- Sections ---------- */
  section.card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 44px;
    margin-bottom: 22px;
  }
  h2.section-title {
    font-family: var(--serif);
    font-size: 1.25rem;
    margin: 0 0 20px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h2.section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ---------- Experience ---------- */
  .job {
    padding-bottom: 26px;
    margin-bottom: 26px;
    border-bottom: 1px solid var(--line);
  }
  .job:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .job-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin-bottom: 2px;
  }
  .job-title-group { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .job-company { font-weight: 700; font-size: 1.05rem; }
  .job-role { color: var(--accent); font-size: 0.92rem; font-weight: 600; }
  .job-meta { color: var(--ink-faint); font-size: 0.85rem; white-space: nowrap; }
  .job-location { color: var(--ink-faint); font-size: 0.85rem; margin-bottom: 10px; }

  .job ul { margin: 10px 0 12px; padding-left: 20px; }
  .job li { margin-bottom: 6px; color: var(--ink-soft); font-size: 0.94rem; }
  .job li::marker { color: var(--accent); }

  .tech-line {
    font-size: 0.82rem;
    color: var(--ink-faint);
    margin-top: 8px;
  }
  .tech-line strong { color: var(--ink-soft); font-weight: 600; }

  /* ---------- Skills ---------- */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
  }
  .skill-group h3 {
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* ---------- Projects ---------- */
  .project {
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .project:last-child { border: none; margin: 0; padding: 0; }
  .project-title { font-weight: 700; font-size: 0.98rem; margin-bottom: 4px; }
  .project-title a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--accent); }
  .project p { margin: 4px 0; color: var(--ink-soft); font-size: 0.92rem; }

  /* ---------- Two column (education / certs) ---------- */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .entry-title { font-weight: 700; font-size: 0.96rem; }
  .entry-sub { color: var(--ink-soft); font-size: 0.9rem; }
  .entry-meta { color: var(--ink-faint); font-size: 0.82rem; margin-top: 2px; }
  .entry { margin-bottom: 16px; }
  .entry:last-child { margin-bottom: 0; }

  footer {
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.8rem;
    margin-top: 24px;
  }

  #load-error {
    display: none;
    background: #fdeceb;
    border: 1px solid #e7b8b3;
    color: #8a2f24;
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 22px;
    font-size: 0.9rem;
  }

  @media (max-width: 640px) {
    header.cv-header, section.card { padding: 26px 22px; }
    .name { font-size: 1.9rem; }
    .two-col { grid-template-columns: 1fr; }
  }

  /* ---------- Print ---------- */
  @media print {
    body { background: #fff; font-size: 12.5px; }
    .toolbar { display: none; }
    .page { padding: 0; max-width: 100%; }
    header.cv-header, section.card {
      border: none;
      border-radius: 0;
      padding: 0 0 18px;
      margin-bottom: 18px;
      break-inside: avoid;
    }
    header.cv-header::before { display: none; }
    .job { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="page">

  <div id="load-error"></div>

  <div class="toolbar">
    <button class="btn" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <header class="cv-header" id="cv-header"></header>

  <section class="card">
    <h2 class="section-title">Experience</h2>
    <div id="experience-list"></div>
  </section>

  <section class="card">
    <h2 class="section-title">Skills</h2>
    <div class="skills-grid" id="skills-grid"></div>
  </section>

  <section class="card" id="projects-card">
    <h2 class="section-title">Side Projects</h2>
    <div id="projects-list"></div>
  </section>

  <section class="card">
    <h2 class="section-title">Education &amp; Certifications</h2>
    <div class="two-col">
      <div id="education-list"></div>
      <div id="certifications-list"></div>
    </div>
  </section>

  <footer>Open this file directly in any browser — no server required.</footer>
</div>

<!-- Edit resume-data.js to update the CV content. -->
<script src="resume-data.js"></script>
<script>
(function () {
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderHeader(d) {
    document.getElementById("cv-header").innerHTML = `
      <h1 class="name">${escapeHtml(d.name)}</h1>
      <p class="role">${escapeHtml(d.role)}</p>
      <div class="contact-row">
        <span>${escapeHtml(d.location)}</span>
        <a href="mailto:${escapeHtml(d.email)}">${escapeHtml(d.email)}</a>
        <a href="${escapeHtml(d.linkedin)}" target="_blank" rel="noopener">${escapeHtml(d.linkedinLabel)}</a>
        <span>${escapeHtml(d.experienceBadge)}</span>
      </div>
      <p class="summary">${escapeHtml(d.summary)}</p>
    `;
  }

  function renderExperience(list) {
    const html = list.map(job => `
      <div class="job">
        <div class="job-head">
          <div class="job-title-group">
            <span class="job-company">${escapeHtml(job.company)}</span>
            <span class="job-role">${escapeHtml(job.role)}</span>
          </div>
          <span class="job-meta">${escapeHtml(job.dates)}</span>
        </div>
        <div class="job-location">${escapeHtml(job.location)}</div>
        <ul>
          ${job.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}
        </ul>
        <div class="tech-line"><strong>Tech:</strong> ${escapeHtml(job.tech.join(", "))}</div>
      </div>
    `).join("");
    document.getElementById("experience-list").innerHTML = html;
  }

  function renderSkills(groups) {
    const html = groups.map(g => `
      <div class="skill-group">
        <h3>${escapeHtml(g.group)}</h3>
        <div class="pill-row">
          ${g.items.map(i => `<span class="pill">${escapeHtml(i)}</span>`).join("")}
        </div>
      </div>
    `).join("");
    document.getElementById("skills-grid").innerHTML = html;
  }

  function renderProjects(list) {
    if (!list || list.length === 0) {
      document.getElementById("projects-card").style.display = "none";
      return;
    }
    const html = list.map(p => `
      <div class="project">
        <div class="project-title">${p.link ? `<a href="${escapeHtml(p.link)}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a>` : escapeHtml(p.title)}</div>
        <p>${escapeHtml(p.description)}</p>
        <div class="tech-line"><strong>Tech:</strong> ${escapeHtml(p.tech.join(", "))}</div>
      </div>
    `).join("");
    document.getElementById("projects-list").innerHTML = html;
  }

  function renderEntries(containerId, list) {
    const html = list.map(e => `
      <div class="entry">
        <div class="entry-title">${escapeHtml(e.title)}</div>
        <div class="entry-sub">${escapeHtml(e.sub)}</div>
        <div class="entry-meta">${escapeHtml(e.meta)}</div>
      </div>
    `).join("");
    document.getElementById(containerId).innerHTML = html;
  }

  try {
    const data = window.RESUME_DATA;
    if (!data) throw new Error("resume-data.js did not set window.RESUME_DATA");
    document.title = data.name + " — CV";
    renderHeader(data);
    renderExperience(data.experience || []);
    renderSkills(data.skills || []);
    renderProjects(data.projects || []);
    renderEntries("education-list", data.education || []);
    renderEntries("certifications-list", data.certifications || []);
  } catch (err) {
    const el = document.getElementById("load-error");
    el.style.display = "block";
    el.textContent = "Could not load CV data: " + err.message;
  }
})();
</script>
</body>
</html>
